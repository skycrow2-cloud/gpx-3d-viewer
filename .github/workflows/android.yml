name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'icons/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Construire l'APK signé
        working-directory: android
        env:
          # mot de passe de la clé de signature (dépôt public : clé réservée à cette appli)
          KEYSTORE_PASSWORD: F1tHLkctAJWR75cs2k83p4rP
        run: gradle --no-daemon assembleRelease
      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk GPX3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GPX3D-apk
          path: GPX3D.apk
      - name: Publier (release « android-latest »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest GPX3D.apk --title "GPX 3D pour Android (build ${{ github.run_number }})" \
            --notes "APK de GPX 3D : ouvre le site https://skycrow2-cloud.github.io/gpx-3d-viewer/ en plein écran. Installer GPX3D.apk sur le téléphone (autoriser l'installation depuis cette source)." \
            --latest=false
